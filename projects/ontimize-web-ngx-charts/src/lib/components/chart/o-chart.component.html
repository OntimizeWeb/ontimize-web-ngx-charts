<div>
  <ng-container [ngSwitch]="type">

    <ngx-charts-pie-chart #pieChart *ngSwitchCase="'pie'" fxFlexFill class="chart" [results]="getAdaptData()" [labels]="true" [explodeSlices]="false"
      [doughnut]="false" [scheme]="color" [labelFormatting]="xFormatting" [ngClass]="chartClass" (select)="selectChart($event)"
      (activate)="activateChart($event)" (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>
    </ngx-charts-pie-chart>

    <ngx-charts-pie-chart #donutChart *ngSwitchCase="'donutChart'" fxFlexFill class="chart" [results]="getAdaptData()" [labels]="true"
      [explodeSlices]="false" [doughnut]="true" [ngClass]="chartClass" [scheme]="color" [labelFormatting]="xFormatting" (select)="selectChart($event)"
      (activate)="activateChart($event)" (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>
    </ngx-charts-pie-chart>

    <ngx-charts-bar-horizontal #horizontalBarChart *ngSwitchCase="'multiBarHorizontalChart'" [showDataLabel]="showDataLabel"
      [results]="getAdaptData()" [xAxis]="true" [yAxis]="true" [scheme]="color" [xAxisTickFormatting]="xFormatting"
      [yAxisTickFormatting]="yFormatting" [ngClass]="chartClass" (select)="selectChart($event)" (activate)="activateChart($event)"
      (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>
    </ngx-charts-bar-horizontal>

    <ngx-charts-bar-vertical #discreteBarChart *ngSwitchCase="'discreteBar'" [showDataLabel]="showDataLabel" [xAxisLabel]="xAxisLabel"
      [yAxisLabel]="yAxisLabel" [xAxis]="true" [yAxis]="true" [results]="getAdaptData()" [scheme]="color" [xAxisTickFormatting]="xFormatting"
      [yAxisTickFormatting]="yFormatting" [ngClass]="chartClass" (select)="selectChart($event)" (activate)="activateChart($event)"
      (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>
    </ngx-charts-bar-vertical>

    <ngx-charts-line-chart #lineChart *ngSwitchCase="'line'" [xAxisLabel]="xAxisLabel" [yAxisLabel]="yAxisLabel" [xAxis]="true" [yAxis]="true"
      [autoScale]="autoScale" [results]="getAdaptData()" [scheme]="color" [xAxisTickFormatting]="xFormatting" [yAxisTickFormatting]="yFormatting"
      [ngClass]="chartClass" (select)="selectChart($event)" (activate)="activateChart($event)" (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

    </ngx-charts-line-chart>

    <ngx-charts-area-chart-stacked #stackedAreaChart *ngSwitchCase="'stackedAreaChart'" [xAxisLabel]="xAxisLabel" [yAxisLabel]="yAxisLabel"
      [xAxis]="true" [yAxis]="true" [results]="getAdaptData()" [scheme]="color" [xAxisTickFormatting]="xFormatting"
      [yAxisTickFormatting]="yFormatting" [ngClass]="chartClass" (select)="selectChart($event)" (activate)="activateChart($event)"
      (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>
    </ngx-charts-area-chart-stacked>

    <ngx-charts-bar-vertical-stacked #multiBarChart *ngSwitchCase="'multiBar'" [showDataLabel]="showDataLabel" [xAxisLabel]="xAxisLabel"
      [yAxisLabel]="yAxisLabel" [xAxis]="true" [yAxis]="true" [results]="getAdaptData()" [scheme]="color" [xAxisTickFormatting]="xFormatting"
      [yAxisTickFormatting]="yFormatting" [ngClass]="chartClass" (select)="selectChart($event)" (activate)="activateChart($event)"
      (deactivate)="deactivateChart($event)">

      <ng-template #tooltipTemplate let-model="model" *ngIf="tooltipTemplateRef">
        <ng-container *ngTemplateOutlet="tooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>

      <ng-template #seriesTooltipTemplate let-model="model" *ngIf="seriesTooltipTemplateRef">
        <ng-container *ngTemplateOutlet="seriesTooltipTemplateRef; context: { model: model }"></ng-container>
      </ng-template>
    </ngx-charts-bar-vertical-stacked>

  </ng-container>
</div>
